<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamSquad - Create Squad</title>
  <link rel="stylesheet" href="../bootsztrap-5.3.8-dist/css/bootstrap.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row align-items-center g-5">
      <div class="col-lg-5">
        <div class="mb-4">
          <span class="badge bg-success mb-3">StreamSquad</span>
          <h1 class="display-5 fw-bold">Create Your Squad</h1>
          <p class="lead text-secondary">
            Bring your friends together and decide what to watch next.
          </p>
        </div>
        <div class="card border-0 shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Squad Features</h5>
            <div class="table-responsive">
              <table class="table align-middle mb-0">
                <tbody>
                  <tr>
                    <td>Shared Watchlist</td>
                    <td><span class="badge bg-success">Available</span></td>
                  </tr>
                  <tr>
                    <td>Watch Party</td>
                    <td><span class="badge bg-success">Available</span></td>
                  </tr>
                  <tr>
                    <td>Voting</td>
                    <td><span class="badge bg-success">Available</span></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
      <div class="col-lg-7">
        <div class="card border-0 shadow">
          <div class="card-body p-4 p-md-5">
            <div class="mb-4">
              <h2 class="fw-bold">Squad Details</h2>
              <p class="text-secondary">Enter the details for your new squad.</p>
            </div>
            <form>
              <div class="mb-4">
                <label for="squadName" class="form-label">Squad Name</label>
                <input type="text" id="squadName" class="form-control form-control-lg" placeholder="Netflix Nerds" required>
              </div>
              <div class="mb-4">
                <label for="squadCode" class="form-label">Squad Code</label>
                <input type="text" id="squadCode" class="form-control" placeholder="NETFLIX24" required>
                <div class="form-text">Share this code with your friends to invite them.</div>
              </div>
              <div class="mb-4">
                <label for="description" class="form-label">Squad Description</label>
                <textarea id="description" class="form-control" rows="3" placeholder="Describe your squad"></textarea>
              </div>
              <div class="form-check form-switch mb-4">
                <input class="form-check-input" type="checkbox" id="notifications" checked>
                <label class="form-check-label" for="notifications">Enable watch party notifications</label>
              </div>
              <div class="progress mb-4" style="height: 8px;">
                <div class="progress-bar bg-success" role="progressbar" style="width: 75%;"></div>
              </div>
              <button type="submit" class="btn btn-success btn-lg w-100">Create Squad</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
